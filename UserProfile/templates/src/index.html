{% extends 'base.html' %}
{% load static %}

{% block body %}
  <div class="container">
    <h2>Bienvenido {{ user.username }}</h2>
    <div class="container row">
      <div class="card col-sm-10 col-md-8 col-lg-6  bg-dark-red m-auto mb-5" >
        <div class="card mt-4 align-items-md-center bg-dark row">
          <a class="card mb-3 mt-3 col-sm-10 col-md-8 col-lg-5 m-auto text-red perfil" href="{% url 'cambiar_img' user.id %}">
            
            
            
            {%if user.image.url == "" %}
            <img class="" src="{{ MEDIA_URL }}/Usuario.jpg" alt="" />
            {% else %}
            <img class="" src="{{ user.image.url }}" alt="" />
            {% endif %}
            
            
            
              
          </a>
        </div>
        <div class="card-body">
          <h4 class="card-title">
          {% if user.is_staff %}
            Administrador
          {% endif %}
            </h4>
            <hr class="col-12 m-auto">
          <p class="card-text">{{ user.nombre|upper }} {{ user.apellido|upper }}</p>
          <p class="card-text">Email: {{ user.email }}</p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
